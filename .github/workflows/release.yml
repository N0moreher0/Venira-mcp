name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v1.0.0). Leave empty to use the latest tag."
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  # ---------------------------------------------------------------------------
  # Build the Node MCP server and package it. Standalone = no Rust binary:
  # the backend (lib/corehost.ts) is pure Node, so the release is just
  # the npm package + a convenience .zip for non-npm users.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run verify

      - name: Package
        run: |
          set -e
          mkdir -p release
          # npm package (for users who prefer npm install)
          npm pack --pack-destination release/

          # Convenience zip: everything a user needs without npm install
          mkdir -p release/zip-root
          cp -r dist release/zip-root/
          cp bin/venira-mcp-coding.js release/zip-root/ 2>/dev/null || true
          cp package.json README.md LICENSE LICENSE-APACHE2.0.txt opencode.example.json release/zip-root/
          cp -r node_modules release/zip-root/
          cd release/zip-root && zip -qr "../venira-mcp-coding-${TAG_NAME}-standalone.zip" .
          cd ../..

          ls -lh release/

        env:
          TAG_NAME: ${{ github.ref_name || 'latest' }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release/

  # ---------------------------------------------------------------------------
  # Build + push the multi-arch Docker image to GitHub Container Registry.
  # ---------------------------------------------------------------------------
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch 'main'}}
          flavor: |
            latest=

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha

  # ---------------------------------------------------------------------------
  # Create the GitHub Release with all assets.
  # ---------------------------------------------------------------------------
  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.ref_name }}" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags --force
            LATEST=$(git tag -l "v*" | sort -V | tail -1)
            if [ -z "$LATEST" ]; then
              echo "::error::No tag found. Push a v* tag or set the tag input."
              exit 1
            fi
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          files: |
            release/venira-mcp-coding-*.tgz
            release/venira-mcp-coding-*-standalone.zip

      # ------------------------------------------------------------------
      # Optional: publish to npm. Only runs when the repo owner has set
      # the `NPM_TOKEN` secret (Settings → Secrets → Actions → NPM_TOKEN).
      # The NPM_TOKEN must have "classic" token scope with publish rights.
      # ------------------------------------------------------------------
      - name: Publish to npm (if NPM_TOKEN is set)
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          cd release
          TARBALL=$(ls venira-mcp-coding-*.tgz | head -1)
          npm publish "$TARBALL" --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org"

      - name: Attach checksums + Docker pull commands to release body
        run: |
          cd release
          TAG="${{ steps.tag.outputs.tag }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "## SHA-256 checksums"
            for f in *.zip *.tgz; do
              [ -f "$f" ] || continue
              HASH=$(sha256sum "$f" | awk '{print $1}')
              echo "- \`$f\`: \`$HASH\`"
            done
            echo ""
            echo "## Docker"
            echo "```bash"
            echo "docker pull ghcr.io/$REPO_LOWER:latest"
            echo "docker run --rm -it \\"
            echo "  -v /path/to/your/project:/workspace \\"
            echo "  -e VENIRA_WORKSPACE=/workspace \\"
            echo "  -e VENIRA_DATA_DIR=/workspace/data \\"
            echo "  ghcr.io/$REPO_LOWER:latest"
            echo "```"
          } >> $GITHUB_STEP_SUMMARY
