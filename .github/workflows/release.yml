name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v1.0.0). Leave empty to use the latest tag."
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  # ---------------------------------------------------------------------------
  # Build the Node MCP server and package it. Standalone = no Rust binary:
  # the backend (lib/corehost.ts) is pure Node, so the release is just
  # the npm package + a convenience .zip for non-npm users.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run verify

      - name: Package
        run: |
          set -e
          mkdir -p release
          # npm package (for users who prefer npm install)
          npm pack --pack-destination release/

          # Convenience zip: everything a user needs without npm install
          mkdir -p release/zip-root
          cp -r dist release/zip-root/
          cp bin/venira-mcp.js release/zip-root/ 2>/dev/null || true
          cp package.json README.md LICENSE LICENSE-APACHE2.0.txt opencode.example.json release/zip-root/
          cp -r node_modules release/zip-root/
          cd release/zip-root && zip -qr "../venira-mcp-${TAG_NAME}-standalone.zip" .
          cd ../..

          ls -lh release/

        env:
          TAG_NAME: ${{ github.ref_name || 'latest' }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release/

  # ---------------------------------------------------------------------------
  # Build + push the multi-arch Docker image to GitHub Container Registry.
  # ---------------------------------------------------------------------------
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=true

      - name: Build and push Docker image (single-arch amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha
          load: false

  # ---------------------------------------------------------------------------
  # Create the GitHub Release with all assets + publish to npm.
  # Only depends on `build` (not `docker`) so a Docker hiccup never blocks
  # the npm package or the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm OIDC trusted publishing (npm exchanges the short-lived
      # GitHub Actions JWT for a scoped publish credential; no secret stored).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.ref_name }}" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags --force
            LATEST=$(git tag -l "v*" | sort -V | tail -1)
            if [ -z "$LATEST" ]; then
              echo "::error::No tag found. Push a v* tag or set the tag input."
              exit 1
            fi
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          files: |
            release/venira-mcp-*.tgz
            release/venira-mcp-*-standalone.zip

      # ------------------------------------------------------------------
      # Publish to npm via OIDC trusted publishing (no long-lived token).
      #
      # Why: as of 2026-07, npm's 2FA-bypass granular access tokens (GATs)
      # are being deprecated for publishing (effective ~2027-01). npm now
      # recommends OIDC trusted publishing: the workflow requests a short-
      # lived JWT from GitHub Actions, npm exchanges it for a scoped
      # publish credential, and nothing long-lived is stored in the repo.
      #
      # Prerequisites (one-time, on the npm side):
      #   1. On npmjs.com: register this repo as a trusted publisher
      #        (npm trust github ... --file release.yml, or the web UI).
      #   2. On GitHub: enable Actions (Settings → Actions → General).
      #
      # The job-level `id-token: write` permission (declared above) is what
      # lets npm exchange the OIDC token. After that, every successful tag
      # push auto-publishes — no secrets.
      #
      # This step runs regardless of the Docker job's outcome so a container
      # hiccup can never block the npm package.
      # ------------------------------------------------------------------
      - name: Publish to npm
        # Two modes:
        #  - Package already on npm AND trusted publishing configured:
        #    npm publish uses the Actions OIDC token automatically (no secret).
        #  - Package not on npm yet (first publish): fail with a clear
        #    message to do a one-time manual publish.
        id: npm
        run: |
          set -e
          # 1. Does the package already exist on npm? (venira-mcp OR the
          #    legacy venira-mcp-coding name — check both)
          if npm view venira-mcp version >/dev/null 2>&1 || npm view venira-mcp-coding version >/dev/null 2>&1; then
            echo "package_exists=true" >> "$GITHUB_OUTPUT"
            V=$(npm view venira-mcp version 2>/dev/null || npm view venira-mcp-coding version 2>/dev/null)
            echo "package exists on npm (v$V)"
          else
            echo "package_exists=false" >> "$GITHUB_OUTPUT"
            echo "::error::First publish must be done manually from a logged-in machine."
            echo "Run once: npm login; npm publish --access public; npm trust github venira-mcp --repo N0moreher0/Venira-mcp --file release.yml --allow-publish --allow-stage-publish -y"
            echo "Subsequent releases will publish automatically via OIDC."
            exit 1
          fi
          cd release
          TARBALL=$(ls venira-mcp-*.tgz | head -1)
          echo "Publishing $TARBALL via OIDC trusted publishing..."
          npm publish "$TARBALL" --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org"

      - name: Confirm publish
        if: steps.npm.outcome == 'success'
        run: |
          V=$(npm view venira-mcp version 2>/dev/null || npm view venira-mcp-coding version 2>/dev/null)
          echo "Published. Current version on npm: $V"
          echo "Users can now run: npx venira-mcp"

      - name: Attach checksums + Docker pull commands to release body
        run: |
          cd release
          TAG="${{ steps.tag.outputs.tag }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "## SHA-256 checksums"
            for f in *.zip *.tgz; do
              [ -f "$f" ] || continue
              HASH=$(sha256sum "$f" | awk '{print $1}')
              echo "- \`$f\`: \`$HASH\`"
            done
            echo ""
            echo "## Docker"
            echo "```bash"
            echo "docker pull ghcr.io/$REPO_LOWER:latest"
            echo "docker run --rm -it \\"
            echo "  -v /path/to/your/project:/workspace \\"
            echo "  -e VENIRA_WORKSPACE=/workspace \\"
            echo "  -e VENIRA_DATA_DIR=/workspace/data \\"
            echo "  ghcr.io/$REPO_LOWER:latest"
            echo "```"
          } >> $GITHUB_STEP_SUMMARY
