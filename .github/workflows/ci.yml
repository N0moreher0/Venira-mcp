name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Run on every supported OS + Node version.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20", "22", "24"]
        # macOS is darwin, where better-sqlite3 needs a prebuilt binary;
        # the explicit binding step below rebuilds if a prebuild is missing.
        exclude: []
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Isolate Venira test data
        shell: bash
        run: echo "VENIRA_DATA_DIR=$RUNNER_TEMP/venira-ci-data" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 is a native module. With npm v12 the install-time
      # security defaults are on (allowScripts off by default); this project
      # opts back in via the `allowScripts` allowlist in package.json, so the
      # `install` script (prebuild-install || node-gyp rebuild) runs and the
      # .node binding should exist. This step makes the expectation explicit
      # and self-heals on the off chance the prebuild didn't land.
      - name: Ensure better-sqlite3 native binding
        # `shell: bash` is required: the Windows runner defaults to
        # PowerShell, which cannot parse the POSIX test below.
        shell: bash
        run: |
          B="node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if [ -f "$B" ]; then
            echo "prebuild present: $B"
            node -e "require('better-sqlite3'); console.log('better-sqlite3 loads OK')"
          else
            echo "prebuild missing — running npm rebuild better-sqlite3..."
            npm rebuild better-sqlite3
            node -e "require('better-sqlite3'); console.log('better-sqlite3 loads OK after rebuild')"
          fi

      - name: Build
        run: npm run build

      - name: Type-check (strict)
        run: npx tsc --noEmit

      - name: Source shape
        run: npm run check:source-shape

      - name: Smoke (in-process backend)
        run: npm run smoke

      - name: Doctor (preflight)
        run: npm run doctor

      - name: Verify (behavioural suite)
        run: npm run verify

      - name: Shell policy corpus
        run: npm run test:policy-corpus

      - name: Bench (MCP end-to-end, recorded only)
        run: npm run bench:mcp

      - name: npm audit
        run: npm audit --audit-level=high || true

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package dry-run (what would be published)
        run: |
          npm pack --dry-run
          npm pack 2>&1 | tail -5

  audit-fallback:
    # Prove that a clean install without native install scripts can still
    # start, while strict audit mode refuses to silently drop audit rows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install without native scripts
        run: npm ci --ignore-scripts

      - name: Start the in-process backend
        run: npm run smoke

      - name: Audit fallback smoke
        run: npm run test:audit-fallback
